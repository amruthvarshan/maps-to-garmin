<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Maps to Garmin</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0c231f" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0c231f;
    --surface: #10322a;
    --line: rgba(111, 227, 173, 0.18);
    --mint: #6fe3ad;
    --amber: #f2b84b;
    --text: #e8f2ee;
    --muted: #8bab9f;
    --danger: #f2a08b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: "Space Grotesk", system-ui, sans-serif;
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: 28px 20px calc(28px + env(safe-area-inset-bottom));
    line-height: 1.5;
  }
  .wrap { width: 100%; max-width: 460px; }

  .eyebrow {
    font-family: "Space Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--mint);
    margin: 0 0 10px;
  }
  h1 {
    font-size: clamp(28px, 8vw, 40px);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
    line-height: 1.05;
  }
  h1 .arrow { color: var(--amber); }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 26px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
  }

  /* route preview */
  .preview { position: relative; }
  .preview svg { width: 100%; height: 168px; display: block; }
  .route-path {
    fill: none;
    stroke: var(--mint);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .route-path.animate {
    stroke-dasharray: var(--len);
    stroke-dashoffset: var(--len);
    animation: draw 1.1s ease forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .node { fill: var(--bg); stroke: var(--mint); stroke-width: 3.5; }
  .node--end { fill: var(--amber); stroke: var(--amber); }

  .status {
    font-family: "Space Mono", monospace;
    font-size: 13.5px;
    color: var(--muted);
    margin: 0;
    word-break: break-word;
  }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--mint); }

  .meta {
    font-family: "Space Mono", monospace;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 18px;
    margin-top: 14px;
  }
  .meta span b { color: var(--text); font-weight: 700; }

  .actions { display: grid; gap: 10px; margin-top: 16px; }
  button {
    font-family: "Space Grotesk", sans-serif;
    font-size: 16px;
    font-weight: 600;
    border: 0;
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    transition: transform 0.06s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.985); }
  button:disabled { opacity: 0.4; cursor: default; }
  .btn-primary { background: var(--amber); color: #2a1c00; }
  .btn-ghost { background: transparent; color: var(--mint); border: 1px solid var(--line); }

  details.debug { margin-top: 12px; }
  details.debug summary {
    font-family: "Space Mono", monospace;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  details.debug pre {
    font-family: "Space Mono", monospace;
    font-size: 11px;
    color: var(--muted);
    background: rgba(0,0,0,0.25);
    border-radius: 10px;
    padding: 12px;
    overflow: auto;
    max-height: 220px;
  }
  details.debug a { color: var(--mint); word-break: break-all; }

  .manual label {
    font-family: "Space Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 8px;
  }
  .manual input {
    width: 100%;
    font-family: "Space Mono", monospace;
    font-size: 13px;
    color: var(--text);
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .manual input:focus { outline: 2px solid var(--mint); outline-offset: 0; }

  footer {
    color: var(--muted);
    font-size: 12px;
    font-family: "Space Mono", monospace;
    text-align: center;
    margin-top: 8px;
    opacity: 0.7;
  }

  @media (prefers-reduced-motion: reduce) {
    .route-path.animate { animation: none; stroke-dashoffset: 0; }
    button:active { transform: none; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Route transfer</p>
    <h1>Maps <span class="arrow">→</span> Garmin</h1>
    <p class="sub">Share a route here from Google Maps to save it as a course for your watch.</p>

    <section class="card">
      <div class="preview" id="preview" hidden>
        <svg id="routeSvg" viewBox="0 0 400 168" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
      </div>
      <p class="status" id="status">Waiting for a shared link…</p>
      <div class="meta" id="meta" hidden>
        <span>points <b id="ptCount">–</b></span>
        <span id="distWrap" hidden>≈ <b id="dist">–</b> km</span>
      </div>

      <div class="actions" id="actions" hidden>
        <button class="btn-primary" id="shareBtn">Send to Garmin Connect</button>
        <button class="btn-ghost" id="downloadBtn">Save route.gpx</button>
      </div>

      <details class="debug" id="debug" hidden>
        <summary>Diagnostics</summary>
        <pre id="debugPre"></pre>
      </details>
    </section>

    <section class="card manual">
      <label for="manualInput">Test without sharing — paste a Maps link</label>
      <input id="manualInput" type="url" inputmode="url" placeholder="https://maps.app.goo.gl/…" />
      <button class="btn-ghost" id="manualBtn">Convert this link</button>
    </section>

    <footer>Uses Google's recommended route. Breadcrumb navigation on the watch.</footer>
  </main>

<script>
  // ===================================================================
  //  EDIT THIS ONE LINE: paste your Cloudflare Worker URL (no trailing slash)
  const WORKER_URL = "https://maps-to-garmin.amruthvarshan.workers.dev";
  // ===================================================================

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");
  let lastBlob = null;

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  function firstUrl(str) {
    if (!str) return null;
    const m = str.match(/https?:\/\/\S+/);
    return m ? m[0] : null;
  }

  async function processUrl(mapsUrl) {
    $("actions").hidden = true;
    $("preview").hidden = true;
    $("meta").hidden = true;
    $("debug").hidden = true;
    lastBlob = null;
    setStatus("Reading the route…");

    if (WORKER_URL.includes("YOUR-WORKER")) {
      setStatus("Set WORKER_URL at the top of index.html to your Worker address first.", "error");
      return;
    }

    try {
      const resp = await fetch(WORKER_URL + "/?u=" + encodeURIComponent(mapsUrl));
      const ct = resp.headers.get("content-type") || "";

      if (!resp.ok || ct.includes("application/json")) {
        let info;
        try { info = await resp.json(); } catch { info = { error: "Request failed (" + resp.status + ")." }; }
        setStatus(info.error || "Something went wrong.", "error");
        showDebug(info);
        return;
      }

      const gpx = await resp.text();
      lastBlob = new Blob([gpx], { type: "application/gpx+xml" });

      const pts = drawRoute(gpx);
      setStatus("Route ready. Send it to Garmin Connect, or save the file and open it there.", "ok");
      $("ptCount").textContent = pts;
      $("meta").hidden = false;
      $("actions").hidden = false;

      // Try an automatic save so the file is already on the phone.
      triggerDownload();
    } catch (e) {
      setStatus("Network error: " + e.message, "error");
    }
  }

  function showDebug(info) {
    const pre = $("debugPre");
    pre.innerHTML = "";
    if (info.expandedUrl) {
      const a = document.createElement("a");
      a.href = info.expandedUrl;
      a.textContent = info.expandedUrl;
      a.target = "_blank";
      pre.appendChild(a);
      pre.appendChild(document.createTextNode("\n\n"));
    }
    pre.appendChild(document.createTextNode(JSON.stringify(info, null, 2)));
    $("debug").hidden = false;
  }

  // Parse trackpoints out of the GPX and draw them — the "breadcrumb" preview.
  function drawRoute(gpx) {
    const re = /lat="(-?\d+(?:\.\d+)?)"\s+lon="(-?\d+(?:\.\d+)?)"/g;
    const pts = [];
    let m;
    while ((m = re.exec(gpx))) pts.push([parseFloat(m[1]), parseFloat(m[2])]);
    if (pts.length < 2) return pts.length;

    let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
    for (const [la, ln] of pts) {
      if (la < minLat) minLat = la; if (la > maxLat) maxLat = la;
      if (ln < minLng) minLng = ln; if (ln > maxLng) maxLng = ln;
    }
    const W = 400, H = 168, pad = 22;
    const spanLat = maxLat - minLat || 1e-6;
    const spanLng = maxLng - minLng || 1e-6;
    const scale = Math.min((W - 2 * pad) / spanLng, (H - 2 * pad) / spanLat);
    const offX = (W - spanLng * scale) / 2;
    const offY = (H - spanLat * scale) / 2;
    const project = ([la, ln]) => [
      offX + (ln - minLng) * scale,
      H - (offY + (la - minLat) * scale), // invert so north is up
    ];

    const proj = pts.map(project);
    const d = proj.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");

    const svg = $("routeSvg");
    const [sx, sy] = proj[0];
    const [ex, ey] = proj[proj.length - 1];
    svg.innerHTML =
      '<path class="route-path" d="' + d + '"></path>' +
      '<circle class="node" cx="' + sx.toFixed(1) + '" cy="' + sy.toFixed(1) + '" r="6"></circle>' +
      '<circle class="node node--end" cx="' + ex.toFixed(1) + '" cy="' + ey.toFixed(1) + '" r="6"></circle>';

    const path = svg.querySelector(".route-path");
    const len = path.getTotalLength();
    path.style.setProperty("--len", len);
    path.classList.add("animate");

    $("preview").hidden = false;
    return pts.length;
  }

  function triggerDownload() {
    if (!lastBlob) return;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(lastBlob);
    a.download = "route.gpx";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }

  async function sendToGarmin() {
    if (!lastBlob) return;
    const file = new File([lastBlob], "route.gpx", { type: "application/gpx+xml" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: "Route" });
      } catch (e) { /* user cancelled */ }
    } else {
      setStatus("Direct sharing isn't available here. Use “Save route.gpx”, then open it and pick Garmin Connect.", "error");
    }
  }

  $("shareBtn").addEventListener("click", sendToGarmin);
  $("downloadBtn").addEventListener("click", triggerDownload);
  $("manualBtn").addEventListener("click", () => {
    const v = firstUrl($("manualInput").value) || $("manualInput").value.trim();
    if (v) processUrl(v);
  });

  // If launched via the share sheet, the link is in the query string.
  const params = new URLSearchParams(location.search);
  const shared = params.get("url") || firstUrl(params.get("text")) || firstUrl(params.get("title"));
  if (shared) processUrl(shared);
</script>
</body>
</html>
