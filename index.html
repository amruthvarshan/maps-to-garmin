<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Best Route to Garmin</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0c231f" />
<meta name="apple-mobile-web-app-title" content="Best Route to Garmin" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0c231f;
    --surface: #10322a;
    --line: rgba(111, 227, 173, 0.18);
    --mint: #6fe3ad;
    --amber: #f2b84b;
    --text: #e8f2ee;
    --muted: #8bab9f;
    --danger: #f2a08b;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: "Space Grotesk", system-ui, sans-serif;
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: 28px 20px calc(28px + env(safe-area-inset-bottom));
    line-height: 1.5;
  }
  .wrap { width: 100%; max-width: 460px; }

  .eyebrow {
    font-family: "Space Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--mint);
    margin: 0 0 10px;
  }
  h1 {
    font-size: clamp(28px, 8vw, 40px);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 32px;
    line-height: 1.05;
  }
  h1 .arrow { color: var(--amber); }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 26px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
  }

  /* route preview */
  .preview { position: relative; }
  .preview svg { width: 100%; height: 168px; display: block; }
  .route-path {
    fill: none;
    stroke: var(--mint);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .route-path.animate {
    stroke-dasharray: var(--len);
    stroke-dashoffset: var(--len);
    animation: draw 1.1s ease forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .node { fill: var(--bg); stroke: var(--mint); stroke-width: 3.5; }
  .node--end { fill: var(--amber); stroke: var(--amber); }

  .status {
    font-family: "Space Mono", monospace;
    font-size: 13.5px;
    color: var(--muted);
    margin: 14px 0 0;
    word-break: break-word;
  }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--mint); }

  .badges {
    position: absolute; left: 10px; top: 10px;
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .badge {
    font-family: "Space Mono", monospace; font-size: 11px;
    background: rgba(12, 35, 31, 0.82); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 9px; color: var(--text);
  }

  .mode-head { margin: 16px 0 2px; }
  .mode-title { font-size: 20px; font-weight: 700; color: var(--amber); letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
  .mode-title svg { width: 20px; height: 20px; flex: 0 0 auto; }
  .mode-byline {
    font-family: "Space Mono", monospace; font-size: 11.5px;
    color: var(--muted); margin-top: 3px; line-height: 1.4;
  }

  .infocard {
    background: rgba(0, 0, 0, 0.18); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 16px; margin-top: 12px;
  }
  .ic-via { font-family: "Space Mono", monospace; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .ic-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ic-val { font-size: 19px; font-weight: 700; color: var(--text); }
  .ic-lbl {
    font-family: "Space Mono", monospace; font-size: 10.5px;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 2px;
  }

  .actions { display: grid; gap: 10px; margin-top: 16px; }
  button {
    font-family: "Space Grotesk", sans-serif;
    font-size: 16px;
    font-weight: 600;
    border: 0;
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    width: 100%;
    transition: transform 0.06s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.985); }
  button:disabled { opacity: 0.4; cursor: default; }
  .btn-primary { background: var(--amber); color: #2a1c00; }
  .btn-ghost { background: transparent; color: var(--mint); border: 1px solid var(--line); }

  .hint {
    font-family: "Space Mono", monospace;
    font-size: 12px;
    color: var(--muted);
    margin: 10px 0 0;
    line-height: 1.45;
  }

  details.turns { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  details.turns summary { font-family: "Space Mono", monospace; font-size: 12px; color: var(--mint); cursor: pointer; list-style: none; }
  details.turns summary::-webkit-details-marker { display: none; }
  .turn { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px dashed rgba(139,171,159,.18); }
  .turn:last-child { border-bottom: 0; }
  .turn .ic { width: 26px; height: 26px; border-radius: 7px; background: rgba(111,227,173,.14); color: var(--mint); display: grid; place-items: center; font-size: 14px; flex: 0 0 auto; }
  .turn .tx { flex: 1; font-size: 14px; }
  .turn .tx .d { font-family: "Space Mono", monospace; font-size: 11px; color: var(--muted); }

  details.debug { margin-top: 12px; }
  details.debug summary {
    font-family: "Space Mono", monospace;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  details.debug pre {
    font-family: "Space Mono", monospace;
    font-size: 11px;
    color: var(--muted);
    background: rgba(0,0,0,0.25);
    border-radius: 10px;
    padding: 12px;
    overflow: auto;
    max-height: 220px;
  }
  details.debug a { color: var(--mint); word-break: break-all; }

  .manual label {
    font-family: "Space Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 8px;
  }
  .manual input {
    width: 100%;
    font-family: "Space Mono", monospace;
    font-size: 13px;
    color: var(--text);
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .manual input:focus { outline: 2px solid var(--mint); outline-offset: 0; }

  footer {
    color: var(--muted);
    font-size: 12px;
    font-family: "Space Mono", monospace;
    text-align: center;
    margin-top: 8px;
    opacity: 0.7;
  }

  @media (prefers-reduced-motion: reduce) {
    .route-path.animate { animation: none; stroke-dashoffset: 0; }
    button:active { transform: none; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Recommended Route</p>
    <h1>Google Maps <span class="arrow">→</span> Garmin</h1>

    <section class="card">
      <div class="preview" id="preview" hidden>
        <svg id="routeSvg" viewBox="0 0 400 168" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
        <div class="badges" id="badges"></div>
      </div>

      <div class="mode-head" id="modeHead" hidden>
        <div class="mode-title" id="modeTitle">Driving route</div>
        <div class="mode-byline" id="modeByline" hidden></div>
      </div>

      <div class="infocard" id="infoCard" hidden>
        <div class="ic-via" id="infoVia" hidden></div>
        <div class="ic-row">
          <div class="ic-stat"><div class="ic-val" id="infoTime">–</div><div class="ic-lbl">time</div></div>
          <div class="ic-stat"><div class="ic-val" id="infoEta">–</div><div class="ic-lbl">arrive</div></div>
          <div class="ic-stat"><div class="ic-val" id="infoDist">–</div><div class="ic-lbl">distance</div></div>
        </div>
      </div>

      <details class="turns" id="turnsBox" hidden>
        <summary id="turnsSummary">&#9656; Turn-by-turn</summary>
        <div id="turns"></div>
      </details>

      <p class="status" id="status">Waiting for a Google Maps link...</p>

      <div class="actions" id="actions" hidden>
        <button class="btn-primary" id="downloadBtn">Download .gpx</button>
      </div>

      <div class="manual" id="startBox" hidden style="margin-top:16px">
        <label for="startInput">Start from — address or “lat, lng”</label>
        <input id="startInput" type="text" inputmode="text" placeholder="e.g. MG Road, Bengaluru" />
        <button class="btn-ghost" id="startBtn">Use this start</button>
      </div>

      <details class="debug" id="debug" hidden>
        <summary>Diagnostics</summary>
        <pre id="debugPre"></pre>
      </details>
    </section>

    <section class="card manual">
      <label for="manualInput">Paste a Google Maps link to parse:</label>
      <input id="manualInput" type="url" inputmode="url" placeholder="https://maps.app.goo.gl/…" />
      <button class="btn-ghost" id="manualBtn">Generate GPX</button>
    </section>

    <footer>Recommended Route v13</footer>
  </main>

<script>
  // ===================================================================
  //  EDIT THIS ONE LINE: paste your Cloudflare Worker URL (no trailing slash)
  const WORKER_URL = "https://maps-to-garmin.amruthvarshan.workers.dev";
  // ===================================================================

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");
  let lastBlob = null;
  let currentLink = null;
  let currentFilename = "route.gpx";

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  function firstUrl(str) {
    if (!str) return null;
    const m = str.match(/https?:\/\/\S+/);
    return m ? m[0] : null;
  }

  async function processUrl(mapsUrl, start) {
    $("actions").hidden = true;
    $("preview").hidden = true;
    $("modeHead").hidden = true;
    $("infoCard").hidden = true;
    $("turnsBox").hidden = true;
    $("debug").hidden = true;
    if (!start) $("startBox").hidden = true;
    lastBlob = null;
    currentLink = mapsUrl;
    setStatus(start ? "Building the route from your start point…" : "Reading the route…");

    if (WORKER_URL.includes("YOUR-WORKER")) {
      setStatus("Set WORKER_URL at the top of index.html to your Worker address first.", "error");
      return;
    }

    try {
      let api = WORKER_URL + "/?u=" + encodeURIComponent(mapsUrl);
      if (start) api += "&start=" + encodeURIComponent(start);
      const resp = await fetch(api);
      const ct = resp.headers.get("content-type") || "";

      if (ct.includes("application/json")) {
        let info;
        try { info = await resp.json(); } catch { info = { error: "Request failed (" + resp.status + ")." }; }
        if (info.needsStart) { requestStart(); return; }
        setStatus(info.error || "Something went wrong.", "error");
        showDebug(info);
        return;
      }
      if (!resp.ok) {
        setStatus("Request failed (" + resp.status + ").", "error");
        return;
      }

      const gpx = await resp.text();
      lastBlob = new Blob([gpx], { type: "application/gpx+xml" });
      currentFilename = filenameFromResponse(resp) || "route.gpx";
      const mode = resp.headers.get("X-Travel-Mode") || resp.headers.get("x-travel-mode") || "DRIVE";
      const info = parseRouteInfo(resp);

      drawRoute(gpx);
      showModeHead(mode);
      showInfoCard(info);
      drawTurns(info.steps, info.description);
      $("downloadBtn").textContent = "Download " + currentFilename;
      $("actions").hidden = false;
      setStatus("Download the .gpx file and open it with Garmin Connect.", "ok");
    } catch (e) {
      setStatus("Network error: " + e.message, "error");
    }
  }

  // Read the destination-based filename the Worker set (via Content-Disposition).
  function filenameFromResponse(resp) {
    const cd = resp.headers.get("Content-Disposition") || resp.headers.get("content-disposition");
    if (!cd) return null;
    let m = cd.match(/filename\*\s*=\s*(?:UTF-8'')?"?([^";]+)"?/i);
    if (!m) m = cd.match(/filename\s*=\s*"?([^";]+)"?/i);
    if (!m) return null;
    try { return decodeURIComponent(m[1].trim()); } catch { return m[1].trim(); }
  }

  // Called when the link starts from "Your location" and has no real origin.
  function requestStart() {
    if (!navigator.geolocation) {
      setStatus("This route starts from “your location”, but this browser can't read GPS. Type a start point below.", "error");
      $("startBox").hidden = false;
      return;
    }
    setStatus("This route starts from “your location” — getting your GPS position…");
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const s = pos.coords.latitude.toFixed(6) + "," + pos.coords.longitude.toFixed(6);
        processUrl(currentLink, s);
      },
      (err) => {
        setStatus(
          "Couldn't get your location (" + err.message + "). Allow location access and try again, or type a start point below.",
          "error"
        );
        $("startBox").hidden = false;
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }

  function showDebug(info) {
    const pre = $("debugPre");
    pre.innerHTML = "";
    if (info.expandedUrl) {
      const a = document.createElement("a");
      a.href = info.expandedUrl;
      a.textContent = info.expandedUrl;
      a.target = "_blank";
      pre.appendChild(a);
      pre.appendChild(document.createTextNode("\n\n"));
    }
    pre.appendChild(document.createTextNode(JSON.stringify(info, null, 2)));
    $("debug").hidden = false;
  }

  // Parse trackpoints out of the GPX and draw them — the "breadcrumb" preview.
  function drawRoute(gpx) {
    const re = /lat="(-?\d+(?:\.\d+)?)"\s+lon="(-?\d+(?:\.\d+)?)"/g;
    const pts = [];
    let m;
    while ((m = re.exec(gpx))) pts.push([parseFloat(m[1]), parseFloat(m[2])]);
    if (pts.length < 2) return pts.length;

    let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
    for (const [la, ln] of pts) {
      if (la < minLat) minLat = la; if (la > maxLat) maxLat = la;
      if (ln < minLng) minLng = ln; if (ln > maxLng) maxLng = ln;
    }
    const W = 400, H = 168, pad = 22;
    const spanLat = maxLat - minLat || 1e-6;
    const spanLng = maxLng - minLng || 1e-6;
    const scale = Math.min((W - 2 * pad) / spanLng, (H - 2 * pad) / spanLat);
    const offX = (W - spanLng * scale) / 2;
    const offY = (H - spanLat * scale) / 2;
    const project = ([la, ln]) => [
      offX + (ln - minLng) * scale,
      H - (offY + (la - minLat) * scale), // invert so north is up
    ];

    const proj = pts.map(project);
    const d = proj.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");

    const svg = $("routeSvg");
    const [sx, sy] = proj[0];
    const [ex, ey] = proj[proj.length - 1];
    svg.innerHTML =
      '<path class="route-path" d="' + d + '"></path>' +
      '<circle class="node" cx="' + sx.toFixed(1) + '" cy="' + sy.toFixed(1) + '" r="6"></circle>' +
      '<circle class="node node--end" cx="' + ex.toFixed(1) + '" cy="' + ey.toFixed(1) + '" r="6"></circle>';

    const path = svg.querySelector(".route-path");
    const len = path.getTotalLength();
    path.style.setProperty("--len", len);
    path.classList.add("animate");

    $("preview").hidden = false;
    return pts.length;
  }

  function triggerDownload() {
    if (!lastBlob) return;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(lastBlob);
    a.download = currentFilename || "route.gpx";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }

  function submitStart() {
    const v = $("startInput").value.trim();
    if (v && currentLink) processUrl(currentLink, v);
  }
  function submitManual() {
    const v = firstUrl($("manualInput").value) || $("manualInput").value.trim();
    if (v) processUrl(v);
  }
  $("downloadBtn").addEventListener("click", triggerDownload);
  $("startBtn").addEventListener("click", submitStart);
  $("manualBtn").addEventListener("click", submitManual);
  $("startInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); submitStart(); } });
  $("manualInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); submitManual(); } });

  const MODE_ICON = {
    DRIVE: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l1.3-4.5A2 2 0 0 1 8.2 7h7.6a2 2 0 0 1 1.9 1.5L19 13"/><rect x="3.5" y="13" width="17" height="4.5" rx="1.5"/><path d="M7 17.5v1.5M17 17.5v1.5"/></svg>',
    WALK: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4.5" r="1.6"/><path d="M13 7l-1.5 4.5 2 2 1 5"/><path d="M11.5 11.5l-3.5 1.5"/><path d="M13.5 15.5l-2.5 3.5"/></svg>',
    BICYCLE: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4.5-6.5h4"/><path d="M10.5 9.5l4 6.5"/><circle cx="15" cy="6" r="0.8"/></svg>',
    TWO_WHEELER: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="16.5" r="3"/><circle cx="18.5" cy="16.5" r="3"/><path d="M5.5 16.5l3.5-4.5h4l2.5 4.5"/><path d="M9.5 12l-1.5-2H6"/><path d="M15 12l2-2h1.5"/></svg>',
    TRANSIT: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4.5" width="14" height="12" rx="2"/><path d="M5 11h14"/><path d="M8 16.5v1.5M16 16.5v1.5"/></svg>',
  };
  function modeIcon(m) { return MODE_ICON[m] || MODE_ICON.DRIVE; }
  function modeLabel(m) { return { DRIVE: "Driving", WALK: "Walking", BICYCLE: "Cycling", TWO_WHEELER: "Two-wheeler", TRANSIT: "Transit" }[m] || "Driving"; }
  function showModeHead(m) {
    $("modeTitle").innerHTML = modeIcon(m) + "<span>" + modeLabel(m) + "</span>";
    const beta = (m === "WALK" || m === "BICYCLE" || m === "TWO_WHEELER");
    if (beta) {
      $("modeByline").textContent = "Beta. Verify paths.";
      $("modeByline").hidden = false;
    } else {
      $("modeByline").hidden = true;
    }
    $("modeHead").hidden = false;
  }
  function parseRouteInfo(resp) {
    const h = resp.headers.get("X-Route-Info") || resp.headers.get("x-route-info");
    if (!h) return {};
    try { return JSON.parse(decodeURIComponent(h)); } catch { return {}; }
  }
  function showInfoCard(info) {
    const dur = info.duration || "";
    const dist = info.distanceMeters || 0;
    $("infoTime").textContent = dur ? fmtDuration(dur) : "\u2014";
    $("infoEta").textContent = dur ? arrival(dur) : "\u2014";
    $("infoDist").textContent = dist ? (dist / 1000).toFixed(1) + " km" : "\u2014";
    if (info.description) { $("infoVia").textContent = info.description; $("infoVia").hidden = false; }
    else $("infoVia").hidden = true;
    const b = [];
    if (dist) b.push('<span class="badge">' + (dist / 1000).toFixed(1) + " km</span>");
    if (dur) b.push('<span class="badge">' + fmtDuration(dur) + "</span>");
    $("badges").innerHTML = b.join("");
    $("infoCard").hidden = false;
  }
  function fmtDuration(s) { const m = Math.round((parseInt(s, 10) || 0) / 60); if (m < 60) return m + " min"; const h = Math.floor(m / 60), mm = m % 60; return h + " h" + (mm ? " " + mm + " min" : ""); }
  function arrival(s) { const d = new Date(Date.now() + (parseInt(s, 10) || 0) * 1000); let h = d.getHours(), mi = d.getMinutes(); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h + ":" + (mi < 10 ? "0" : "") + mi + " " + ap; }
  function fmtDist(m) { if (m >= 1000) return (m / 1000).toFixed(1) + " km"; return Math.round(m) + " m"; }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  const MANEUVER = { TURN_LEFT: "\u2190", TURN_RIGHT: "\u2192", TURN_SLIGHT_LEFT: "\u2196", TURN_SLIGHT_RIGHT: "\u2197",
    TURN_SHARP_LEFT: "\u2190", TURN_SHARP_RIGHT: "\u2192", UTURN_LEFT: "\u21b6", UTURN_RIGHT: "\u21b7",
    STRAIGHT: "\u2191", MERGE: "\u2934", RAMP_LEFT: "\u2196", RAMP_RIGHT: "\u2197", FORK_LEFT: "\u2196", FORK_RIGHT: "\u2197",
    ROUNDABOUT_LEFT: "\u21ba", ROUNDABOUT_RIGHT: "\u21bb", NAME_CHANGE: "\u2191", DEPART: "\u25c9", DESTINATION: "\u25ce" };
  function drawTurns(steps, via) {
    const list = Array.isArray(steps) ? steps : [];
    $("turnsSummary").textContent = "\u25b8 Turn-by-turn" + (via ? " \u00b7 " + via : "");
    $("turns").innerHTML = list.map((s) => {
      const ar = MANEUVER[s.maneuver] || "\u2022";
      const dist = s.distanceMeters ? fmtDist(s.distanceMeters) : "";
      return '<div class="turn"><div class="ic">' + ar + '</div><div class="tx"><div>' + esc(s.instruction || "Continue") + "</div>" + (dist ? '<div class="d">' + dist + "</div>" : "") + "</div></div>";
    }).join("");
    $("turnsBox").hidden = list.length === 0;
  }

  // If launched via the share sheet, the link is in the query string.
  const params = new URLSearchParams(location.search);
  const shared = params.get("url") || firstUrl(params.get("text")) || firstUrl(params.get("title"));
  if (shared) { $("manualInput").value = shared; processUrl(shared); }
</script>
</body>
</html>
